<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stackwagon" />
    <meta name="theme-color" content="#1d2027" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <title>Stackwagon</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1d2027; overflow: hidden;
        touch-action: none; -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
      #game { position: fixed; top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom);
        left: env(safe-area-inset-left); right: env(safe-area-inset-right); }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
